name: release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Parse Python sources without creating bytecode
        shell: pwsh
        run: |
          @'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path), feature_version=(3, 10))
          '@ | python -
      - name: Validate installer plan
        run: python -B scripts/install.py --dry-run
      - name: Parse PowerShell launchers
        shell: pwsh
        run: |
          foreach ($path in @('scripts/install.ps1', 'scripts/webmind.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Reject private runtime artifacts
        shell: pwsh
        run: |
          $tracked = git ls-files
          $forbidden = $tracked | Where-Object {
            $_ -match '(^|/)(mem-location\.json|webmind-profile\.json|\.webmind-install\.json)$' -or
            $_ -match '(^|/)[^/]+-Profile/' -or
            $_ -match '(^|/)[a-z]{1,8}-[1-9][0-9]{0,2}-mem/' -or
            $_ -match '\.(pem|key|p12|pfx)$'
          }
          if ($forbidden) { throw "Private runtime artifacts are tracked:`n$($forbidden -join "`n")" }
