name: release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Parse Python sources
        run: python -m compileall -q scripts skills
      - name: Run non-interactive diagnostics
        run: python scripts/webmind.py doctor --json
      - name: Validate manifests and PowerShell syntax
        shell: pwsh
        run: |
          Get-Content -Raw .claude-plugin/plugin.json | ConvertFrom-Json | Out-Null
          Get-Content -Raw .claude-plugin/marketplace.json | ConvertFrom-Json | Out-Null
          Get-Content -Raw edition.json | ConvertFrom-Json | Out-Null
          foreach ($path in @('scripts/install.ps1', 'scripts/webmind.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Verify release manifest
        shell: pwsh
        run: |
          foreach ($line in Get-Content MANIFEST.sha256) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid manifest line: $line" }
            $expected = $Matches[1]
            $path = $Matches[2]
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing file: $path" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Hash mismatch: $path" }
          }
