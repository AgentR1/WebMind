name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installer plan
        run: bash ./scripts/install.sh --dry-run
      - name: Compile Python sources
        run: python -m compileall -q scripts components
      - name: Check shell syntax
        run: bash -n scripts/install.sh scripts/webmind.sh components/webmind-cdp/scripts/launch_chrome_macos.sh
      - name: Check runtime data is absent
        run: |
          test ! -e .webmind-install.json
          test ! -e components/webmind-mem/mem-location.json
