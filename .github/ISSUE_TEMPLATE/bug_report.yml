name: Bug report
description: 报告可复现的问题（请勿提交敏感信息）
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除凭据、Cookie、Profile、Mem 内容、私人截图和个人绝对路径。
  - type: input
    id: version
    attributes:
      label: WebMind 版本
      placeholder: 例如 9.9.9
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: macOS、Python、Claude Code 和浏览器版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除所有凭据、Profile、Mem、私人数据和个人路径。
          required: true
        - label: 这不是应当私下报告的安全漏洞。
          required: true
