name: Feature request
description: 建议新功能或改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全与隐私影响
      description: 说明是否涉及外部状态变更、账号数据、桌面权限、Profile 或 Mem。
    validations:
      required: true
