name: Feature request
description: 提议功能或工作流改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 这个功能要解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、授权边界和可能影响的组件
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 已尝试或考虑过的其他方式
