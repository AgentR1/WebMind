name: Native code regression
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run portable and native code branches
        run: python -B scripts/run_tests.py
      - name: Parse bash wrappers
        if: runner.os == 'macOS'
        run: bash -n scripts/install.sh scripts/webuse.sh
      - name: Parse and smoke-test PowerShell wrappers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('scripts/install.ps1', 'scripts/webuse.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          & ./scripts/install.ps1 --dry-run --skip-deps
          if ($LASTEXITCODE -ne 0) { throw 'Install wrapper smoke test failed' }
          & ./scripts/webuse.ps1 mem --help
          if ($LASTEXITCODE -ne 0) { throw 'Runtime wrapper smoke test failed' }
